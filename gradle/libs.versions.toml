
[versions]
android-gradle-plugin = "7.1.2"
kotlin = "1.7.20"
navigation-safeargs = "2.5.3"
core-ktx = "1.9.0"
appcompat = "1.6.1"
material = "1.5.0"
constraintlayout = "2.1.3"
legacy-support = "1.0.0"
junit = "4.13.2"
junit-ext = "1.1.3"
espresso-core = "3.4.0"
navigation = "2.5.3"
retrofit = "2.6.0"
okhttp-logging-interceptor = "4.5.0"
kotlinx-coroutines = "1.6.1"
glide = "4.12.0"
hilt = "2.44"

[libraries]
# AndroidX Core (KTX, AppCompat, Legacy)
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacy-support" }

# Material Design & ConstraintLayout (UI Components)
google-android-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }

# Jetpack Navigation (Fragment & UI)
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigation" }

# Retrofit & OkHttp (Networking)
squareup-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
squareup-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
squareup-okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp-logging-interceptor" }

# Kotlin Coroutines (Concurrency)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

# Glide (Image Loading)
github-bumptech-glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
github-bumptech-glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# JUnit & Espresso (Testing)
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }

# Hilt Dependency Injection (DI)
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" } # Hilt Android Library
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" } # Hilt Compiler (KAPT)

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
navigation-safeargs-kotlin = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation-safeargs" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" } # Hilt Gradle Plugin
